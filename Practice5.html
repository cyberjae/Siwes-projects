<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 60px;
        }
        h1 {
            color: #2c3e50;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1 id="heading">Hello!</h1>
    <button onclick="changeHeading()">Click Here</button>

    <script>
            function changeHeading() {
                document.getElementById("heading").innerText ="Task Completed!";
            }
    </script>

</body>
</html>
