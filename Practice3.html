<!DOCTYPE html>
<html>
<head>
    <style>
        .container {
            display: flex;
            gap: 20px;
            padding: 20px;
        }
        .box {
            flex: 1;
            height: 120px;
            background-color: #111f2d;
            color: rgb(206, 202, 249);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div  class="box">Box 1</div>
        <div  class="box">Box 2</div>
        <div  class="box">Box 3</div>
    </div>
</body>
</html>
